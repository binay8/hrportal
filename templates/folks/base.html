{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Portal</title>
    <!-- Add Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }
    </style>
</head>
<body>
    <header style="display: flex; align-items: center; justify-content: space-between; background-color: #e6dfdf; padding: 10px 20px;">
        <div style="display: flex; align-items: center;">
            <a href="{% url 'home' %}">
                <img src="{% static 'folks/company_logo.png' %}" alt="Company Logo" style="height: 40px;">
            </a>
        </div>
        <nav id="context-menu">
            <!-- Context-based menu items go here -->
            {% if user.is_authenticated %}
                <span>Welcome, {{ user.username }}!</span>
                <a href="{% url 'home' %}" style="margin-left: 15px;">Home</a>
                <a href="/logout/" style="margin-left: 15px;">Logout</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- This is where child template content will be inserted -->
        {% endblock %}
    </main>

    <footer style="background-color: #999494; padding: 20px; text-align: center; margin-top: 50px;">
        <p>&copy; 2025 HR Portal. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
